<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Iniciar sesión</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">

<div
    class="container d-flex justify-content-center align-items-center"
    style="min-height: 100vh;"
>

    <div
        class="card shadow-sm border-0"
        style="width: 100%; max-width: 430px;"
    >

        <div class="card-body p-5">

            <div class="text-center mb-4">

                <h1 class="h3 fw-semibold">
                    Planificación de Horarios
                </h1>

                <p class="text-secondary mb-0">
                    Ingrese sus credenciales para continuar.
                </p>

            </div>


            {% if form.errors %}

                <div class="alert alert-danger">

                    Usuario o contraseña incorrectos.

                </div>

            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <div class="mb-3">

                    <label
                        for="id_username"
                        class="form-label"
                    >
                        Usuario
                    </label>

                    <input
                        type="text"
                        name="username"
                        id="id_username"
                        class="form-control"
                        required
                        autofocus
                    >

                </div>


                <div class="mb-4">

                    <label
                        for="id_password"
                        class="form-label"
                    >
                        Contraseña
                    </label>

                    <input
                        type="password"
                        name="password"
                        id="id_password"
                        class="form-control"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >
                    Iniciar sesión
                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
