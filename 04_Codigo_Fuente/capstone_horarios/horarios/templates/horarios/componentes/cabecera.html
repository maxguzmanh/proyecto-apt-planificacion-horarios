{# Identidad de página compartida; las acciones permanecen en la cabecera exterior. #}
<div class="page-heading">
    <span class="page-heading-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" focusable="false">
            {% if icono == 'dashboard' %}
            <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
            {% elif icono == 'mantenedores' %}
            <ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 4 16 4 16 0V5M4 12v7c0 4 16 4 16 0v-7"/>
            {% else %}
            <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/>
            {% if icono == 'profesor' %}<circle cx="12" cy="14" r="1.5"/><path d="M8 19c0-3 8-3 8 0"/>{% else %}<path d="M7 14h3m4 0h3m-10 4h3"/>{% endif %}
            {% endif %}
        </svg>
    </span>
    <div class="page-heading-copy">
        <h1 class="workspace-title">{{ titulo }}</h1>
        {% if descripcion %}<p class="workspace-description">{{ descripcion }}</p>{% endif %}
    </div>
</div>
